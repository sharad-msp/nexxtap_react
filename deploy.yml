name: 🚀 Deploy React App to Staging Server

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./   # 👈 set working directory here
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json  # 👈 update this too

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 🚚 Deploy via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/*"   # 👈 folder where build is generated
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: ✅ Verify deployment
        run: echo "✅ Deployed React build to ${{ secrets.DEPLOY_PATH }} on ${{ secrets.SERVER_IP }}"
